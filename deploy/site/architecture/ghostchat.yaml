# Copied from docs/architecture.yaml in the project's repository at commit 5da595b by
# tools/sync-architecture.sh. Edit it there, where a test checks it against the code.
# How GhostChat is put together, as data. The portfolio site draws this file as an interactive
# diagram (martinomwenga.com/projects/ghostchat/architecture) and its assistant reads it to walk
# visitors through the system. A test (backend/tests/architecture.test.js) fails if a part names a
# file that no longer exists, or a connection or step names a part that isn't here. `story` names
# the heading on the site's story page that says more about a part; the site checks those itself.
title: How GhostChat is put together
summary: >-
  Everything secret happens in the two browsers. The server in between checks, stores and relays
  messages it can't read, can't write and can't quietly reorder, and publishes everyone's public
  keys in a log it can't rewrite without being caught.
repository: https://github.com/MrtnOmwenga/GhostChat

# The lanes are the stages a message passes through, top to bottom.
lanes:
  - id: sender
    label: 1. The sender's browser
  - id: server
    label: 2. The server and its database (never holds a private key)
  - id: recipient
    label: 3. The recipient's browser

parts:
  - id: vault
    lane: sender
    name: Private keys
    what: The sender's private keys, unlocked in their browser by half of their password.
    detail: >-
      The password is split before it leaves the device. One half signs in; the other opens a
      vault of private keys that the server stores and can never open. A 24-word phrase can
      rebuild every key the account will ever use.
    code: [frontend/src/lib/crypto/vault.js, frontend/src/lib/crypto/password.js, frontend/src/lib/keystore.js]
    handbook: ghostchat/01-accounts-and-keys
    story: solution

  - id: seal
    lane: sender
    name: Lock and sign
    what: Encrypts each message with a fresh key, links it to the one before, and signs the whole envelope.
    detail: >-
      The message key is sealed twice, to the recipient and to the sender. The envelope carries
      its number in the conversation and the hash of the message before it, and the signature
      covers both, so the order is part of what was signed.
    code: [frontend/src/lib/crypto/envelope.js, frontend/src/lib/messaging.js]
    handbook: ghostchat/02-messages
    story: decision-verifiable-not-deniable

  - id: relay
    lane: server
    name: Relay
    what: Takes signed envelopes over a WebSocket and delivers them to whoever is in the conversation.
    detail: >-
      Socket.IO, with Redis between instances so a message sent to one instance reaches a
      recipient connected to another. It sees who talks to whom and when. It never sees what
      was said.
    code: [backend/src/realtime.js, backend/src/auth.js]
    handbook: ghostchat/02-messages

  - id: chain
    lane: server
    name: Chain keeper
    what: Accepts a message only if it is properly signed and links onto the newest message in its conversation.
    detail: >-
      When two people send at the same moment only one can be next. The other is answered with
      a conflict and the message it missed, and its browser links onto that, signs again and
      resends without the person doing anything.
    code: [backend/src/services/chain.js]
    handbook: ghostchat/02-messages
    story: decision-deletion-that-keeps-the-chain-intact

  - id: messages
    lane: server
    name: Stored messages
    what: Locked text, sealed keys, signatures and links, in MongoDB. Nothing here opens without a private key from a browser.
    detail: >-
      Files are stored the same way, encrypted in the browser and named by the hash of their
      encrypted bytes. A deleted message leaves its place in the chain and loses its content.
    code: [backend/src/models/message.js, backend/src/services/files.js]
    handbook: ghostchat/02-messages
    story: decision-files-in-the-database-not-a-separate-store

  - id: log
    lane: server
    name: Key log
    what: A public, append-only log of everyone's public keys, the same design as Certificate Transparency.
    detail: >-
      The server signs the head of the log and anchors it in Bitcoin. If it showed two people
      different keys for the same person, the proofs they each hold would not fit together.
    code: [backend/src/services/log.js, backend/src/services/merkle.js, backend/src/services/anchoring.js, backend/src/models/logLeaf.js]
    handbook: ghostchat/03-identity
    story: decision-a-transparency-log-not-a-blockchain

  - id: open
    lane: recipient
    name: Check and open
    what: The recipient's browser checks the signature and the link to the previous message before it decrypts anything.
    detail: >-
      The server checks too, but that check is a courtesy. This one is the control: a forged,
      edited, reordered or missing message shows up here as a broken link, and the conversation
      says so.
    code: [frontend/src/lib/messaging.js, frontend/src/lib/crypto/envelope.js]
    handbook: ghostchat/02-messages
    story: solution

  - id: trust
    lane: recipient
    name: Whose key is this?
    what: Checks that the key which signed a message really is the sender's, without taking the server's word for it.
    detail: >-
      Every change of key is signed by the key before it, back to the first. The browser checks
      that history, checks the key log vouches for it, and remembers the keys of contacts the
      recipient has verified in person.
    code: [frontend/src/lib/crypto/keyHistory.js, frontend/src/lib/log.js, frontend/src/lib/keys.js]
    handbook: ghostchat/03-identity
    story: decision-pre-rotation-for-key-changes

connections:
  - { from: vault, to: seal, label: private keys }
  - { from: vault, to: log, label: publishes public keys }
  - { from: seal, to: relay, label: signed envelope }
  - { from: relay, to: chain, label: asks to append }
  - { from: chain, to: messages, label: stores }
  - { from: relay, to: open, label: delivers }
  - { from: open, to: trust, label: "who signed this?" }
  - { from: trust, to: log, label: asks for proof }

flows:
  - id: send
    title: One message, from the sender to the recipient
    summary: >-
      Follow a single message from one person's keyboard to another's screen. At each stage,
      notice what the server is given: enough to check and deliver the message, never enough to
      read or fake it.
    steps:
      - from: vault
        to: seal
        title: Keys that never left
        text: >-
          The sender's private keys are already unlocked in their browser. They were made there,
          and the server has only ever held a locked copy.
      - from: seal
        to: relay
        title: Lock, link, sign, send
        text: >-
          The browser encrypts the text with a fresh key, seals that key to the recipient, adds
          the hash of the message before it, signs the lot and sends the envelope.
      - from: relay
        to: chain
        title: Is it next in line?
        text: >-
          The server checks the signature and that the envelope links onto the newest message.
          If the other person sent at the same moment and got in first, the sender's browser is
          told, links onto that message, signs again and resends.
      - from: chain
        to: messages
        title: Stored, still locked
        text: >-
          The envelope is saved as it arrived. The server holds the locked text and the sealed
          keys and can open neither.
      - from: relay
        to: open
        title: Delivered
        text: >-
          The envelope goes to the recipient's browser over its open connection, even if that
          connection is to a different server instance.
      - from: open
        to: trust
        title: Who signed this?
        text: >-
          Before decrypting, the recipient's browser checks the signature and the link to the
          message before, and asks whether the signing key is really the sender's.
      - from: trust
        to: log
        title: Proof, not the server's word
        text: >-
          The sender's key history is checked link by link and against the public key log. Only
          then is the message opened and shown, with a shield beside it.
    proof: >-
      Tests send two messages at the same moment and check one lands and the other is answered
      with what it missed (backend/tests/realtime.test.js); browser tests tamper with a stored
      message and check the conversation shows the break (e2e/tests/tampering.spec.js).
