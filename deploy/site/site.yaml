projects:
  - slug: redacted
    name: Redacted
    kicker: Redacted · Security · Live demo · Secrets black out mid-sentence
    headline: "Multi-tenant access control where hidden text is never sent: PostgreSQL row-level security and 605 tests"
    standfirst: >-
      The agency is fictional; the security is not. Three agents share one live document, and the
      moment one loses clearance, the classified words vanish from their screen.
    plain: >-
      Like a shared Google Doc where some words are classified. People without clearance see black
      bars, and a manager can take away someone's access while they're typing.
    hood: >-
      NestJS and Yjs over PostgreSQL row-level security. Hidden text never leaves the server, and
      open connections are re-authorized before a permission change commits. 600+ tests.
    figure: redacted
    placement: lead
    facts:
      - { label: Tests, value: "600+" }
      - { label: Mutation score, value: "100% (policy)" }
      - { label: Stack, value: "NestJS · Yjs · PostgreSQL" }
    repo: https://github.com/MrtnOmwenga/RBAC-API
    docs: https://github.com/MrtnOmwenga/RBAC-API/blob/master/docs/COLLABORATION.md
    demo: https://redacted.${DOMAIN}
    tour: https://redacted.${DOMAIN}/?tour=play
    health: https://redacted.${DOMAIN}/health/ready
    monitor: redacted
    intro:
      - kicker: Architecture
        title: One database, enforced isolation
        plain: Each part of a document is stored separately, so a part you aren't cleared for is simply never sent to you.
        body: >-
          A NestJS API and a Hocuspocus realtime server share one PostgreSQL database with forced
          row-level security. Every section of a briefing is its own Yjs document, so hiding a
          section means never syncing it at all.
        facts: [{ label: row-level security on every table, value: Forced }, { label: "per section, so hiding is structural", value: 1 document }]
      - kicker: Redaction
        title: Hidden text never reaches the browser
        plain: The black bars aren't a disguise laid over the text. The text itself never arrives, and the tests prove it.
        body: >-
          The API returns a bar rounded up to 40 characters, so even lengths don't leak. A
          Playwright test records every HTTP response and WebSocket frame and checks the hidden text
          appears in none of them.
        facts: [{ label: redaction rounding, value: 40 characters }, { label: of hidden text in captured traffic, value: 0 bytes }]
      - kicker: Live permissions
        title: Demoted mid-keystroke
        plain: Take away someone's access while they're typing, and their very next keystroke is refused.
        body: >-
          Changes send NOTIFY inside their transaction. Open connections are locked read-only before
          the commit, re-checked after it, and resynced, so no edit lands after a demotion and no
          legitimate edit is lost.
        facts: [{ label: "connections lock before the commit", value: Fail closed }, { label: fallback re-check if a change rolls back, value: 3 s }]
      - kicker: Word-level classification
        title: Mark words Secret, like making them bold
        plain: Select a few words and classify them, the way you'd make them bold. Readers without clearance see bars instead.
        body: >-
          A classification is a Yjs formatting mark. A pre-update hook refuses marks above the
          sender's clearance; readers below a mark get a copy the server writes for their level.
        facts: [{ label: to rebuild a redacted copy, value: 100 ms }, { label: clearance levels, value: "4" }]
      - kicker: Proof
        title: More than 600 tests behind the bars
        plain: Every rule above has a test that tries to break it, and the tests are themselves checked by deliberately introducing bugs.
        body: >-
          A generated authorization matrix of 441 requests, property tests over 500 random
          documents, browser tests with three users at once, and a 100% mutation score on the
          security-critical modules.
        facts: [{ label: tests, value: "605" }, { label: "mutation score, security modules", value: "100%" }]

  - slug: ghostchat
    name: GhostChat
    kicker: GhostChat · Cryptography · Live demo · Leak-proof
    headline: "End-to-end encrypted chat that stays private if its own server is breached, with a verifiable key log"
    plain: >-
      Private messaging where even whoever runs the server can't read your messages or quietly
      change them.
    hood: >-
      Encryption in the browser with libsodium, signed hash-chained history, and a key
      transparency log with Merkle proofs.
    figure: chain
    placement: side
    facts:
      - { label: Crypto, value: libsodium only }
      - { label: Integrity, value: Merkle proofs }
      - { label: Stack, value: "React · Express · MongoDB" }
    repo: https://github.com/MrtnOmwenga/GhostChat
    docs: https://github.com/MrtnOmwenga/GhostChat/blob/master/docs/DESIGN.md
    demo: https://ghostchat.${DOMAIN}
    health: https://ghostchat.${DOMAIN}/health
    monitor: ghostchat
    intro:
      - kicker: The threat model
        title: Assume the server is the attacker
        plain: The server stores and relays your messages, but it can't read them, fake them or quietly change them.
        body: >-
          A database dump holds ciphertext only. Every message is signed by its author and linked
          into a hash chain, so the server can't forge, edit, reorder or drop messages without
          every client noticing.
        facts: [{ label: private keys ever held by the server, value: "0" }]
      - kicker: Passwords and keys
        title: The password is split before it leaves the browser
        plain: Your password unlocks your keys on your own device. The server only ever sees a derived login key.
        body: >-
          Argon2id turns the password into two keys: one signs in, the other unlocks an encrypted
          key vault that never leaves the browser. A 24-word recovery phrase regenerates every key
          the account will ever use.
        facts: [{ label: Argon2id memory, value: 64 MiB }, { label: recovery phrase, value: 24 words }]
      - kicker: Key transparency
        title: A public log the server can't rewrite
        plain: Nobody, including the server, can swap in a fake key for someone without it being caught.
        body: >-
          Every key change goes into a Merkle tree log, the Certificate Transparency design.
          Browsers check inclusion and consistency proofs, and the log root is anchored daily on
          Bitcoin through OpenTimestamps.
        facts: [{ label: log design, value: RFC 6962 }]
      - kicker: Files
        title: Encrypted in the browser, stored by hash
        plain: Photos and files are locked before upload, stripped of location data, and truly deleted with their message.
        body: >-
          Files are encrypted in authenticated 64 KiB chunks, stored by the hash of the ciphertext
          in MongoDB GridFS, and checked against the hash the sender signed before decrypting.
        facts: [{ label: per file, value: 10 MB }, { label: chunk size, value: 64 KiB }]

  - slug: lighthouse
    name: Lighthouse
    kicker: Lighthouse · Infrastructure · The site that monitors itself
    headline: "Uptime monitoring and incident tracking in Go, deployed with signed images and no stored credentials"
    standfirst: >-
      Every 15 minutes it checks each project on this page. When one goes down it opens an
      incident, writes up what happened, and closes the case when service returns. Nobody has to
      press a button.
    plain: >-
      A system that keeps watch over every project, notices when one goes down, records an incident
      and publishes what happened. It also checks a demo is up before opening it for you.
    hood: >-
      Go and PostgreSQL with row-level security, SSRF-safe probes, incidents opened by a state
      machine, property tests and fuzzing. Runs free on Cloud Run behind a Cloudflare edge,
      deployed without stored credentials.
    figure: architecture
    placement: feature
    facts:
      - { label: Checks, value: every 15 min }
      - { label: Language, value: Go }
      - { label: Tests, value: "race, fuzz, property" }
    repo: https://github.com/MrtnOmwenga/lighthouse
    demo: /console/
    monitor: lighthouse
    intro:
      - kicker: The sandbox
        title: Your own copy of the monitor
        plain: You get three pretend websites to watch, all yours, gone in two hours. No account needed.
        body: >-
          A throwaway tenant, isolated from every other visitor by PostgreSQL row-level security,
          seeded with simulated sites. The sandbox never sends traffic to real addresses.
        facts: [{ label: to set up, value: 1 click }, { label: before it disappears, value: 2 hours }]
      - kicker: Break something
        title: Take a site down and watch the monitor notice
        plain: Switch a site to Down. Two failed checks later, an incident opens by itself.
        body: >-
          Each result goes through a small state machine with hysteresis: several failures in a
          row open an incident, several successes close it, so one blip never pages anyone.
        facts: [{ label: between checks, value: 10 s }, { label: failures to open an incident, value: "2" }]
      - kicker: Run the incident
        title: Post updates, then let it recover
        plain: Write a public update or an internal note, then switch the site back and watch the incident close.
        body: >-
          Public updates appear on your status page; internal notes never do. Everything on the page
          is server-rendered from the same data the console edits.
        facts: [{ label: kinds of update, value: public · internal }]

  - slug: pair-bridge
    name: PairBridge
    kicker: PairBridge · Systems · Off the grid
    headline: "Linux and Android file sharing over the local network: a FUSE filesystem and an Android documents provider"
    plain: >-
      A Linux PC shows up in every Android file picker, like Google Drive, but the files never
      leave your own network.
    hood: >-
      A FastAPI server on the PC and a native Android DocumentsProvider, built around one rule:
      the tablet only opens outbound connections.
    figure: devices
    placement: brief
    facts:
      - { label: PC, value: "Python · FastAPI" }
      - { label: Tablet, value: "Kotlin · Android" }
      - { label: Cloud, value: none }
    repo: https://github.com/MrtnOmwenga/pair-bridge
    no_demo_note: Runs on your own devices, so there's no hosted demo.
