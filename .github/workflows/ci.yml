name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, lint, tests (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Tests (Postgres via testcontainers)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  console:
    name: Console (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: console }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm, cache-dependency-path: console/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deploy-config:
    name: Deployment config (Terraform, Kubernetes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_version: 1.16.4 }
      - name: Terraform format and validate (both stacks)
        run: |
          for stack in deploy/terraform deploy/cloudrun; do
            echo "== $stack"
            terraform -chdir="$stack" fmt -check -recursive
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
      - name: Edge Worker tests
        run: node --test deploy/cloudrun/edge/worker.test.js
      - name: Kubernetes manifests render and validate
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          kubectl kustomize deploy/k8s/production > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 rendered.yaml
          ./kubeconform -strict -summary -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/k8s/flux/*.yaml
      - name: Every container runs non-root, read-only, without capabilities
        run: |
          python3 - <<'PY'
          import yaml, sys
          bad = []
          for d in yaml.safe_load_all(open('rendered.yaml')):
              if not d: continue
              spec = d.get('spec', {})
              tpl = spec.get('template') or spec.get('jobTemplate', {}).get('spec', {}).get('template')
              if not tpl: continue
              ps = tpl['spec']
              psc = ps.get('securityContext', {})
              if not (psc.get('runAsNonRoot') and psc.get('seccompProfile', {}).get('type') == 'RuntimeDefault'):
                  bad.append(f"{d['metadata']['name']}: pod security context")
              for c in ps.get('initContainers', []) + ps['containers']:
                  sc = c.get('securityContext', {})
                  if not (sc.get('allowPrivilegeEscalation') is False and sc.get('readOnlyRootFilesystem') is True and sc.get('capabilities', {}).get('drop') == ['ALL']):
                      bad.append(f"{d['metadata']['name']}/{c['name']}")
          if bad:
              sys.exit('not restricted: ' + ', '.join(bad))
          print('every container is restricted')
          PY

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - run: go test -run='^$' -fuzz=FuzzSparkline -fuzztime=45s ./internal/status
      - run: go test -run='^$' -fuzz=FuzzNormalize -fuzztime=45s ./internal/web
      - run: go test -run='^$' -fuzz=FuzzPage -fuzztime=45s ./internal/analytics

  security:
    name: Secrets, vulnerabilities, image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - name: govulncheck (reachable vulnerabilities in code and dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: docker build -t lighthouse:ci .
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lighthouse:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  smoke:
    name: Compose smoke test and console in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate secrets for the stack
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "APP_DB_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "DEV_LOGIN=true" >> .env
          echo "SANDBOX_LIMIT_PER_HOUR=1000" >> .env
      - run: docker compose up --build -d --wait lighthouse
      - name: Status page, API and sandbox answer
        run: |
          curl -fsS http://localhost:8080/ | grep -q "The Lighthouse"
          curl -fsS http://localhost:8080/projects/redacted | grep -q "Key decisions"
          curl -fsS http://localhost:8080/status | grep -q "Systems data"
          curl -fsS http://localhost:8080/api/status | grep -q '"overall"'
          curl -fsS -X POST -H "Origin: http://localhost:8080" -c jar http://localhost:8080/api/sandbox
          curl -fsS -b jar http://localhost:8080/api/monitors | grep -q Storefront
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: npm, cache-dependency-path: console/package-lock.json }
      - name: Console end to end (Playwright)
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: playwright-traces, path: console/test-results, retention-days: 7 }
      - if: failure()
        run: docker compose logs
